<!doctype html>
<!--
  Source of the README images, the social card and the promo video.
  Open with ?view=banner | how | social | logo | video[&t=seconds].
  assets/src/render.mjs screenshots every view and encodes the video.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>astro-vault promo</title>
    <style>
      :root {
        --bg: #0b0a14;
        --panel: #14121f;
        --panel-2: #1b1829;
        --line: #2a2640;
        --text: #ece9f7;
        --muted: #9a94b5;
        --subtle: #6d6788;
        --violet: #8b5cf6;
        --violet-2: #a78bfa;
        --orange: #fb923c;
        --green: #34d399;
        --gradient: linear-gradient(135deg, #8b5cf6 0%, #d946ef 50%, #fb923c 100%);
        --sans: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        --mono: 'Cascadia Code', 'Cascadia Mono', Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(60% 70% at 15% 10%, rgba(139, 92, 246, 0.22), transparent 70%),
          radial-gradient(50% 60% at 95% 100%, rgba(251, 146, 60, 0.16), transparent 70%), var(--bg);
      }
      #stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(80% 80% at 50% 50%, #000 40%, transparent 100%);
      }
      .grad {
        background: var(--gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Glyph */
      .glyph {
        display: grid;
        place-items: center;
        border-radius: 22%;
        background: var(--gradient);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12) inset,
          0 20px 60px rgba(139, 92, 246, 0.35);
        color: #fff;
        font-family: var(--mono);
        font-weight: 700;
        letter-spacing: -0.06em;
      }
      .wordmark {
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        padding: 0.4em 0.85em;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-weight: 500;
        white-space: nowrap;
      }
      .chip i {
        width: 0.5em;
        height: 0.5em;
        border-radius: 50%;
        background: var(--gradient);
      }

      /* Window chrome shared by the editor and the browser */
      .window {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--muted);
        font-size: 14px;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dots span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #3a3552;
      }
      .bar .label {
        flex: 1;
        text-align: center;
        margin-right: 50px;
      }
      .url {
        flex: 1;
        margin-right: 50px;
        padding: 5px 12px;
        border-radius: 8px;
        background: var(--bg);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 13px;
      }

      /* Editor */
      .editor {
        padding: 22px 26px;
        font-family: var(--mono);
        font-size: 17px;
        line-height: 1.75;
        white-space: pre;
        color: #d6d1ea;
      }
      .editor .fm {
        color: var(--subtle);
      }
      .editor .h {
        color: #fff;
        font-weight: 700;
      }
      .editor .wl {
        color: var(--violet-2);
      }
      .editor .wl b {
        color: var(--subtle);
        font-weight: 400;
      }
      .editor .co {
        color: var(--green);
      }
      .editor .q {
        color: var(--subtle);
      }

      /* Rendered page */
      .page {
        display: grid;
        grid-template-columns: 190px 1fr;
        background: #fbfaff;
        color: #1d1a2b;
        font-size: 15px;
      }
      .side {
        padding: 22px 14px;
        border-right: 1px solid #ebe8f5;
        background: #f5f3fc;
        font-size: 14px;
      }
      .side .home {
        display: block;
        padding: 5px 8px;
        border-radius: 7px;
        font-weight: 600;
        color: #3b3651;
      }
      .side .folder {
        margin-top: 10px;
        padding: 0 8px;
        color: #3b3651;
        font-weight: 600;
      }
      .side .folder::before {
        content: '▸ ';
        color: #a39dbd;
      }
      .side .folder.open::before {
        content: '▾ ';
      }
      .side .leaf {
        margin: 3px 0 0 10px;
        padding: 4px 8px;
        border-left: 1px solid #e3dff0;
        color: #6b6585;
      }
      .side .leaf.current {
        border-radius: 0 7px 7px 0;
        background: #ebe5ff;
        color: #6d28d9;
        font-weight: 600;
      }
      .content {
        padding: 26px 34px 28px;
      }
      .crumb {
        color: #8e88a8;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .content h1 {
        margin: 6px 0 4px;
        font-size: 34px;
        letter-spacing: -0.03em;
      }
      .tag {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        background: #efeafe;
        color: #6d28d9;
        font-size: 12px;
        font-weight: 600;
      }
      .content p {
        margin: 12px 0;
        line-height: 1.6;
        color: #3b3651;
      }
      a.wikilink {
        color: #7c3aed;
        text-decoration: underline;
        text-decoration-color: rgba(124, 58, 237, 0.35);
        text-underline-offset: 3px;
      }
      .missing {
        color: #9a94b5;
        text-decoration: underline dotted;
        text-underline-offset: 3px;
      }
      .img {
        height: 84px;
        margin: 12px 0;
        border: 1px solid #ebe8f5;
        border-radius: 12px;
        background: #f3f0ff;
      }
      .callout {
        margin: 12px 0;
        padding: 10px 14px;
        border: 1px solid rgba(22, 163, 74, 0.25);
        border-left: 4px solid #16a34a;
        border-radius: 12px;
        background: rgba(22, 163, 74, 0.07);
        color: #3b3651;
      }
      .callout b {
        display: block;
        color: #15803d;
      }
      .backlinks {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #ebe8f5;
      }
      .backlinks small {
        display: block;
        margin-bottom: 7px;
        color: #8e88a8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .backlinks span {
        display: inline-block;
        margin-right: 6px;
        padding: 3px 10px;
        border: 1px solid #e3dff0;
        border-radius: 999px;
        color: #3b3651;
        font-size: 13px;
      }
      .arrow {
        display: grid;
        place-items: center;
        gap: 10px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 16px;
      }
      .arrow svg {
        width: 90px;
      }
      .pill {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-2);
        color: var(--text);
        white-space: nowrap;
      }
      .hl {
        border-radius: 6px;
        box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.55);
        background: rgba(167, 139, 250, 0.16);
      }

      /* Code panel */
      .code {
        padding: 26px 30px;
        font-family: var(--mono);
        font-size: 24px;
        line-height: 1.7;
        white-space: pre;
        color: #d6d1ea;
      }
      .code .c {
        color: var(--subtle);
      }
      .code .k {
        color: #f472b6;
      }
      .code .s {
        color: #fbbf24;
      }
      .code .f {
        color: var(--violet-2);
      }
      .code .p {
        color: var(--green);
      }

      /* Feature cards */
      .card {
        padding: 26px 28px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(20, 18, 31, 0.85);
      }
      .card .ico {
        min-width: 44px;
        padding: 0 10px;
        width: max-content;
        white-space: nowrap;
        height: 44px;
        margin-bottom: 16px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: rgba(139, 92, 246, 0.16);
        color: var(--violet-2);
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 700;
      }
      .card h3 {
        margin: 0 0 6px;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 19px;
        line-height: 1.45;
      }
      .abs {
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const view = params.get('view') ?? 'banner';
      const stage = document.getElementById('stage');

      const glyph = (size) =>
        `<div class="glyph" style="width:${size}px;height:${size}px;font-size:${size * 0.34}px">[[ ]]</div>`;

      const wordmark = (size) =>
        `<div class="wordmark" style="font-size:${size}px">astro<span class="grad">-vault</span></div>`;

      const editor = (style = '') => `
        <div class="window" style="${style}">
          <div class="bar"><div class="dots"><span></span><span></span><span></span></div><div class="label">Ideas / Digital garden.md</div></div>
<div class="editor"><span class="fm" data-line>---</span>
<span class="fm" data-line>tags: [ideas]</span>
<span class="fm" data-line>aliases: [Garden]</span>
<span class="fm" data-line>---</span>
<span class="h" data-line># Digital garden</span>

<span data-line>Notes that grow over time. Start</span>
<span data-line>with <span class="wl" data-hl-src>[[Wikilinks]]</span> or jump to</span>
<span data-line><span class="wl">[[Callouts<b>#</b>Folds<b>|</b>folds]]</span>.</span>

<span data-line class="wl">![[graph.png]]</span>

<span data-line><span class="q">&gt;</span> <span class="co">[!tip]</span> Link freely</span>
<span data-line><span class="q">&gt;</span> Missing notes like <span class="wl">[[Someday]]</span></span>
<span data-line><span class="q">&gt;</span> stay muted.</span></div>
        </div>`;

      const page = (style = '') => `
        <div class="window" style="${style}">
          <div class="bar"><div class="dots"><span></span><span></span><span></span></div><div class="url">example.com/notes/ideas/digital-garden</div></div>
          <div class="page">
            <div class="side" data-part>
              <span class="home">⌂ Start here</span>
              <div class="folder open">Guides</div>
              <div class="leaf">Wikilinks</div>
              <div class="leaf">Callouts</div>
              <div class="folder open">Ideas</div>
              <div class="leaf current">Digital garden</div>
            </div>
            <div class="content">
              <div data-part><div class="crumb">Ideas</div><h1>Digital garden</h1><span class="tag">#ideas</span></div>
              <p data-part>Notes that grow over time. Start with <a class="wikilink" data-hl-dst>Wikilinks</a> or jump to <a class="wikilink">folds</a>.</p>
              <div class="img" data-part>${graphSvg()}</div>
              <div class="callout" data-part><b>Link freely</b>Missing notes like <span class="missing">Someday</span> stay muted.</div>
              <div class="backlinks" data-part><small>Linked from</small><span>Start here</span><span>Wikilinks</span></div>
            </div>
          </div>
        </div>`;

      function graphSvg() {
        return `<svg viewBox="0 0 400 84" width="100%" height="84"><g stroke="#c4b5fd" stroke-width="2.5" fill="none"><path d="M70 42 L170 24 L260 52 L340 30"/><path d="M170 24 L200 66"/></g>
          <g fill="#8b5cf6"><circle cx="70" cy="42" r="9"/><circle cx="170" cy="24" r="9"/><circle cx="260" cy="52" r="9"/><circle cx="340" cy="30" r="9"/><circle cx="200" cy="66" r="7" fill="#fb923c"/></g></svg>`;
      }

      const arrow = (label) => `
        <div class="arrow">
          <svg viewBox="0 0 90 24" fill="none"><defs><linearGradient id="ag" gradientUnits="userSpaceOnUse" x1="2" y1="12" x2="82" y2="12"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs><path d="M2 12h78" stroke="url(#ag)" stroke-width="3" stroke-linecap="round"/><path d="M72 4l10 8-10 8" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="pill">${label}</span>
        </div>`;

      const features = [
        ['[[]]', 'Wikilinks', 'By name, path, heading or alias, like Obsidian.'],
        ['![ ]', 'Image embeds', 'Optimized by Astro at build time.'],
        ['[!]', 'Callouts', 'Note, tip, warning… foldable too.'],
        ['←', 'Backlinks', 'Every note knows who links to it.'],
        ['▾', 'Folder tree', 'Sidebar, breadcrumbs, previous / next.'],
        ['{ }', 'Your design', 'Content collections, .md and .mdx, no client JS.']
      ];

      const views = {
        logo() {
          stage.style.cssText = 'width:512px;height:512px;display:grid;place-items:center;';
          stage.innerHTML = glyph(360);
        },

        banner() {
          stage.style.cssText = 'width:1280px;height:640px;';
          stage.innerHTML = `
            <div class="abs" style="left:80px;top:150px;width:780px">
              <div style="display:flex;align-items:center;gap:22px">${glyph(88)}${wordmark(72)}</div>
              <p style="margin:34px 0 0;font-size:36px;line-height:1.25;font-weight:600;letter-spacing:-0.02em">Publish your Obsidian vault<br>with <span class="grad">any Astro site</span>.</p>
              <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;font-size:17px">
                ${['Wikilinks', 'Embeds', 'Callouts', 'Backlinks', 'Folder tree'].map((t) => `<span class="chip"><i></i>${t}</span>`).join('')}
              </div>
            </div>
            <div class="abs" style="left:760px;top:92px;width:600px;transform:scale(0.78);transform-origin:top left">${page()}</div>`;
        },

        social() {
          stage.style.cssText = 'width:1200px;height:675px;';
          stage.innerHTML = `
            <div class="abs" style="left:70px;top:58px;display:flex;align-items:center;gap:18px">${glyph(64)}${wordmark(48)}</div>
            <div class="abs" style="left:70px;top:150px;font-size:44px;font-weight:700;letter-spacing:-0.03em;line-height:1.15">Write in Obsidian. <span class="grad">Publish with Astro.</span></div>
            <div class="abs" style="left:60px;top:236px;width:640px;transform:scale(0.68);transform-origin:top left">${editor()}</div>
            <div class="abs" style="left:512px;top:380px">${arrow('astro build')}</div>
            <div class="abs" style="left:668px;top:236px;width:740px;transform:scale(0.68);transform-origin:top left">${page()}</div>
            <div class="abs" style="right:60px;top:66px;font-family:var(--mono);font-size:20px"><span class="pill">npx astro add astro-vault</span></div>`;
        },

        how() {
          stage.style.cssText = 'width:1600px;height:900px;';
          stage.innerHTML = `
            <div class="abs" style="left:0;right:0;top:56px;text-align:center">
              <div style="font-size:46px;font-weight:700;letter-spacing:-0.03em">Write in Obsidian. <span class="grad">Publish with Astro.</span></div>
              <div style="margin-top:12px;color:var(--muted);font-size:22px">The same note, before and after <code style="font-family:var(--mono);color:var(--text)">astro build</code></div>
            </div>
            <div class="abs" style="left:80px;top:210px;width:600px">${editor()}</div>
            <div class="abs" style="left:700px;top:430px">${arrow('astro build')}</div>
            <div class="abs" style="left:860px;top:210px;width:660px">${page()}</div>`;
        },

        video() {
          stage.style.cssText = 'width:1920px;height:1080px;';
          stage.innerHTML = `
            <!-- 1. Title -->
            <section data-t="0,3.4" data-fx="fade" class="abs" style="inset:0;display:grid;place-items:center">
              <div style="display:grid;justify-items:center;gap:34px">
                <div data-t="0.15" data-fx="scale">${glyph(170)}</div>
                <div data-t="0.55" data-fx="up">${wordmark(120)}</div>
                <div data-t="1.1" data-fx="up" style="font-size:44px;color:var(--muted);font-weight:500">Publish your Obsidian vault with <span class="grad" style="font-weight:700">Astro</span>.</div>
              </div>
            </section>

            <!-- 2. Obsidian -> page -->
            <section data-t="3.4,10.8" data-fx="fade" class="abs" style="inset:0">
              <div data-t="3.6" data-fx="up" class="abs" style="left:0;right:0;top:70px;text-align:center;font-size:56px;font-weight:700;letter-spacing:-0.03em">
                Write in Obsidian. <span data-t="6.2" data-fx="fade" class="grad">Publish with Astro.</span>
              </div>
              <div data-t="3.9" data-fx="left" class="abs" style="left:130px;top:250px;width:720px" id="ed">${editor()}</div>
              <div data-t="6.0" data-fx="scale" class="abs" style="left:880px;top:470px">${arrow('astro build')}</div>
              <div data-t="6.4" data-fx="right" class="abs" style="left:1060px;top:300px;width:740px" id="pg">${page()}</div>
            </section>

            <!-- 3. Features -->
            <section data-t="10.8,16.4" data-fx="fade" class="abs" style="inset:0">
              <div data-t="11.0" data-fx="up" class="abs" style="left:0;right:0;top:170px;text-align:center;font-size:58px;font-weight:700;letter-spacing:-0.03em">
                Everything Obsidian users expect, <span class="grad">resolved at build time</span>
              </div>
              <div class="abs" style="left:170px;right:170px;top:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:28px">
                ${features
                  .map(
                    ([ico, title, text], i) =>
                      `<div class="card" data-t="${(11.5 + i * 0.35).toFixed(2)}" data-fx="up"><div class="ico">${ico}</div><h3>${title}</h3><p>${text}</p></div>`
                  )
                  .join('')}
              </div>
            </section>

            <!-- 4. Setup -->
            <section data-t="16.4,21.6" data-fx="fade" class="abs" style="inset:0">
              <div data-t="16.6" data-fx="up" class="abs" style="left:0;right:0;top:170px;text-align:center;font-size:58px;font-weight:700;letter-spacing:-0.03em">
                Set up in <span class="grad">three steps</span>
              </div>
              <div data-t="16.9" data-fx="up" class="window abs" style="left:310px;right:310px;top:330px">
                <div class="bar"><div class="dots"><span></span><span></span><span></span></div><div class="label">your Astro site</div></div>
<div class="code"><span data-t="17.3" data-fx="fade"><span class="c"># 1. Install</span>
<span class="p">$</span> npx astro add astro-vault</span>

<span data-t="18.5" data-fx="fade"><span class="c">// 2. content.config.ts</span>
notes: <span class="f">defineCollection</span>({ loader: <span class="f">vaultLoader</span>(), schema: vaultSchema })</span>

<span data-t="19.7" data-fx="fade"><span class="c">// 3. Any page</span>
<span class="k">const</span> vault = <span class="k">await</span> <span class="f">getVault</span>(); <span class="c">// tree, backlinks, links</span></span></div>
              </div>
            </section>

            <!-- 5. Call to action -->
            <section data-t="21.6" data-fx="fade" class="abs" style="inset:0;display:grid;place-items:center">
              <div style="display:grid;justify-items:center;gap:30px">
                <div data-t="21.8" data-fx="scale" style="display:flex;align-items:center;gap:30px">${glyph(120)}${wordmark(96)}</div>
                <div data-t="22.3" data-fx="up" style="font-family:var(--mono);font-size:40px"><span class="pill" style="padding:16px 30px">npm i astro-vault</span></div>
                <div data-t="22.8" data-fx="up" style="font-size:32px;color:var(--muted)">github.com/manuel-cerezo/astro-vault</div>
                <div data-t="23.2" data-fx="up" style="display:flex;gap:14px;font-size:22px;margin-top:6px">
                  ${['Open source · MIT', 'Astro 7', 'Zero client JS'].map((t) => `<span class="chip"><i></i>${t}</span>`).join('')}
                </div>
              </div>
            </section>`;

          // Editor lines and page parts reveal one by one.
          stage.querySelectorAll('#ed [data-line]').forEach((line, i) => {
            line.dataset.t = (4.3 + i * 0.13).toFixed(2);
            line.dataset.fx = 'fade';
          });
          stage.querySelectorAll('#pg [data-part]').forEach((part, i) => {
            part.dataset.t = (6.9 + i * 0.3).toFixed(2);
            part.dataset.fx = 'up';
          });
          stage.querySelectorAll('[data-hl-src], [data-hl-dst]').forEach((el) => (el.dataset.hl = '8.8,10.4'));
        }
      };

      // A still of the video with a play button, to link to the video from Markdown.
      views.poster = () => views.video();

      views[view]();

      const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
      const IN = 0.7;
      const OUT = 0.45;

      /** Deterministic frame: every element's style is a pure function of t (seconds). */
      window.renderAt = (t) => {
        for (const el of stage.querySelectorAll('[data-t]')) {
          const [start, end] = el.dataset.t.split(',').map(Number);
          const p = ease((t - start) / IN);
          const q = end === undefined ? 0 : ease((t - end + OUT) / OUT);
          const v = p * (1 - q);
          el.style.opacity = v.toFixed(3);
          const fx = el.dataset.fx;
          const k = 1 - v;
          el.style.transform =
            fx === 'up'
              ? `translateY(${(k * 36).toFixed(1)}px)`
              : fx === 'left'
                ? `translateX(${(-k * 80).toFixed(1)}px)`
                : fx === 'right'
                  ? `translateX(${(k * 80).toFixed(1)}px)`
                  : fx === 'scale'
                    ? `scale(${(0.82 + 0.18 * v).toFixed(3)})`
                    : '';
        }
        for (const el of stage.querySelectorAll('[data-hl]')) {
          const [start, end] = el.dataset.hl.split(',').map(Number);
          el.classList.toggle('hl', t >= start && t < end);
        }
      };

      if (view === 'video') window.renderAt(Number(params.get('t') ?? 8));
      if (view === 'poster') {
        window.renderAt(9.6);
        stage.insertAdjacentHTML(
          'beforeend',
          `<div class="abs" style="inset:0;display:grid;place-items:center;background:rgba(11,10,20,0.35)">
            <div style="display:flex;align-items:center;gap:22px;padding:22px 38px 22px 26px;border-radius:999px;background:rgba(20,18,31,0.92);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)">
              <div style="width:84px;height:84px;border-radius:50%;background:var(--gradient);display:grid;place-items:center">
                <svg width="34" height="38" viewBox="0 0 34 38"><path d="M4 3l27 16L4 35z" fill="#fff"/></svg>
              </div>
              <span style="font-size:40px;font-weight:700;letter-spacing:-0.02em">Watch the 25-second overview</span>
            </div>
          </div>`
        );
      }
    </script>
  </body>
</html>
