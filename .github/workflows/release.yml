# Every push to main validates the repository and, when the commits since the
# last release include a feat, fix or perf (or a breaking change), publishes a
# new version to npm and creates the matching tag and GitHub release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      issues: write # semantic-release/github needs it even with comments off
      pull-requests: write
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:example
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed until npm trusted publishing is set up for the package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
